[tox]
envlist = lint

[testenv:reformat]
commands =
    ruff format .
    ruff check --fix .
allowlist_externals =
    ruff
skip_install = true

[testenv:lint]
description = check code style
commands =
    ruff format --check .
    ruff check .
skip_install = true
allowlist_externals =
    ruff

[flake8]
max-line-length = 99
exclude = .git,__pycache__,.tox,.venv,venv,node_modules,__init__.py
extend-ignore = S608,E203,W503,RST304,E402,T001,S404,S603,S410,S320,E501,SIM113,E800,S105
