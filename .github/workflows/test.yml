name: lint
on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: install python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Setup uv
      uses: astral-sh/setup-uv@v5

    - name: Install
      run: |
        uv sync --locked

    - name: run lint
      run: |
        uv run tox -e lint
