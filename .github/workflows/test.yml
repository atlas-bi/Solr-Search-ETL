name: lint
on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: install python
      uses: actions/setup-python@v6
      with:
        python-version: '3.14'

    - name: Setup Poetry
      uses: snok/install-poetry@v1

    - name: Install
      run: |
        poetry install

    - name: run lint
      run: |
        poetry run tox -e lint
